name: update

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: merge upstreams
        run: python build_my_library.py

      - name: commit if changed
        run: |
          N=$(python -c 'import json;print(len(json.load(open("movie.json",encoding="utf-8"))["sites"]))')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movie.json movie-lite.json jar
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "auto: 定时合并 A+B+C+D | ${N}站"
          git push
